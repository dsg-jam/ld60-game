[package]
name = "ld60-game-player"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }
publish = { workspace = true }

[features]
debug_port = ["bevy/bevy_remote", "dep:serde_json", "ld60-game-core/debug_port"]

[dependencies]
ld60-game-core = { workspace = true }
ld60-locale = { workspace = true }
serde_json = { workspace = true, features = ["std"], optional = true }
winit = { workspace = true }

[dependencies.bevy]
workspace = true
features = [
  "3d_bevy_render",
  "bevy_audio",
  "bevy_winit",
  "custom_cursor",
  "default_app",
  "picking",
  "std",
  "ui_api",
  "ui_bevy_render",
]

[dev-dependencies]
ld60-game-core = { workspace = true, features = ["test-support"] }
ld60-locale = { workspace = true, features = ["test-support"] }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
workspace = true
features = ["Document", "Element", "Window"]

[lints]
workspace = true
