[package]
name = "ld60-game"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }
publish = { workspace = true }

[features]
debug_port = ["bevy/bevy_remote", "dep:serde_json"]

[dependencies]
fluent-bundle = { workspace = true }
ld60-calco = { workspace = true, features = ["serde"] }
ld60-devices = { workspace = true, features = ["serde"] }
ld60-levels = { workspace = true }
ld60-machine = { workspace = true }
rand = { workspace = true }
ron = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"], optional = true }
unic-langid = { workspace = true, features = ["macros"] }

[dependencies.bevy]
workspace = true
features = [
  "3d",
  "area_light_luts",
  "audio",
  "custom_cursor",
  "system_clipboard",
  "ui",
  "wav",
]

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["Document", "Element", "Storage", "Window"] }

[lints]
workspace = true
