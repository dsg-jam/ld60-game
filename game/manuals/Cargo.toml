[package]
name = "ld60-game-manuals"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }
publish = { workspace = true }

[features]
test-support = []

[dependencies]
ld60-calco = { workspace = true, features = ["serde"] }
ld60-devices = { workspace = true, features = ["serde"] }
ld60-game-core = { workspace = true }
ld60-game-device = { workspace = true }
ld60-game-run = { workspace = true }
ld60-geometry = { workspace = true }
ld60-levels = { workspace = true }
ld60-locale = { workspace = true }
ron = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "std"] }

[dependencies.bevy]
workspace = true
features = ["3d_bevy_render", "default_app", "picking", "std", "ui_api"]

[dev-dependencies]
ld60-game-core = { workspace = true, features = ["test-support"] }
ld60-game-run = { workspace = true, features = ["test-support"] }
ld60-locale = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
