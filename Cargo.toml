[workspace]
resolver = "3"
members = [
  "game/app",
  "game/city",
  "game/cli",
  "game/core",
  "game/device",
  "game/geometry",
  "game/levels",
  "game/locale",
  "game/store",
  "silicon/asm",
  "silicon/calco",
  "silicon/devices",
  "silicon/dsl",
  "silicon/machine",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99.1"
authors = ["Kevin Schärer <dev@mineiwik.dev>", "Simon Berger <simon@siku2.io>"]
license = "MIT"
repository = "https://github.com/dsg-jam/ld60-game"
readme = "README.md"
publish = false

[workspace.dependencies]
ld60-asm = { path = "silicon/asm" }
ld60-calco = { path = "silicon/calco" }
ld60-devices = { path = "silicon/devices" }
ld60-dsl = { path = "silicon/dsl" }
ld60-game-city = { path = "game/city" }
ld60-game-core = { path = "game/core" }
ld60-game-device = { path = "game/device" }
ld60-geometry = { path = "game/geometry" }
ld60-levels = { path = "game/levels" }
ld60-locale = { path = "game/locale" }
ld60-machine = { path = "silicon/machine" }
ld60-store = { path = "game/store" }

bevy = { version = "0.20.0", default-features = false }
fluent-bundle = { version = "0.16.0", default-features = false }
rand = { version = "0.10.3", default-features = false }
ron = { version = "0.12.2", default-features = false }
serde = { version = "1.0.229", default-features = false }
serde_json = { version = "1.0.154", default-features = false }
unic-langid = { version = "0.9.6", default-features = false }
web-sys = { version = "0.3.106", default-features = false }
winit = { version = "0.30.13", default-features = false }

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
arbitrary_source_item_ordering = "warn"
mod_module_files = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
