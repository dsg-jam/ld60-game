[package]
name = "ld60-game-core"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }
publish = { workspace = true }

[features]
debug_port = ["bevy/bevy_remote", "dep:serde_json"]
test-support = []

[dependencies]
ld60-geometry = { workspace = true }
ld60-locale = { workspace = true }
ld60-store = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"], optional = true }

[dependencies.bevy]
workspace = true
features = ["default_app", "std"]

[dev-dependencies]
ld60-locale = { workspace = true, features = ["test-support"] }
ld60-store = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
