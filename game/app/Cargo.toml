[package]
name = "ld60-game"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }
publish = { workspace = true }

[features]
console = ["debug_port", "dep:ld60-game-console"]
debug_port = [
  "bevy/bevy_remote",
  "dep:serde_json",
  "ld60-game-city/debug_port",
  "ld60-game-computer/debug_port",
  "ld60-game-core/debug_port",
  "ld60-game-device/debug_port",
  "ld60-game-parts/debug_port",
  "ld60-game-player/debug_port",
]

[dependencies]
ld60-calco = { workspace = true, features = ["serde"] }
ld60-devices = { workspace = true, features = ["serde"] }
ld60-game-audio = { workspace = true }
ld60-game-city = { workspace = true }
ld60-game-computer = { workspace = true }
ld60-game-console = { workspace = true, optional = true }
ld60-game-core = { workspace = true }
ld60-game-device = { workspace = true }
ld60-game-manuals = { workspace = true }
ld60-game-parts = { workspace = true }
ld60-game-player = { workspace = true }
ld60-game-props = { workspace = true }
ld60-game-run = { workspace = true }
ld60-geometry = { workspace = true }
ld60-levels = { workspace = true }
ld60-locale = { workspace = true }
ld60-machine = { workspace = true }
ld60-store = { workspace = true }
rand = { workspace = true }
ron = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"], optional = true }

[dependencies.bevy]
workspace = true
features = [
  "3d_bevy_render",
  "area_light_luts",
  "bevy_audio",
  "bevy_clipboard",
  "bevy_ui_widgets",
  "bevy_winit",
  "custom_cursor",
  "default_app",
  "multi_threaded",
  "picking",
  "scene",
  "std",
  "symphonia-vorbis",
  "sysinfo_plugin",
  "system_clipboard",
  "ui_api",
  "ui_bevy_render",
  "wav",
  "wayland",
  "webgl2",
  "webgpu",
  "x11",
]

[dev-dependencies]
ld60-game-core = { workspace = true, features = ["test-support"] }
ld60-game-device = { workspace = true, features = ["test-support"] }
ld60-game-manuals = { workspace = true, features = ["test-support"] }
ld60-game-run = { workspace = true, features = ["test-support"] }
ld60-locale = { workspace = true, features = ["test-support"] }
ld60-store = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
