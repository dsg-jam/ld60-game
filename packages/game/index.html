<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bugs From Home</title>
    <link data-trunk rel="rust" data-bin="ld60-game" data-wasm-opt="z"
      data-initializer="initializer.js" />
    <link data-trunk rel="copy-dir" href="../../assets" />
    <script>
    // Browsers start audio suspended until a user gesture.
    (() => {
      const contexts = [];
      const Base = window.AudioContext;
      window.AudioContext = new Proxy(Base, {
        construct(target, args) {
          const context = new target(...args);
          contexts.push(context);
          return context;
        },
      });
      const resume = () => {
        for (const context of contexts) {
          if (context.state !== "running") context.resume();
        }
      };
      for (const event of ["pointerdown", "keydown", "touchstart"]) {
        document.addEventListener(event, resume, { capture: true });
      }
    })();
    </script>
    <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #2a2624;
      overflow: hidden;
    }
    canvas {
      display: block;
      outline: none;
    }
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1em;
      padding: 2em;
      z-index: 1;
      background: #2a2624;
      color: #e8dfd0;
      font: 16px monospace;
      text-align: center;
    }
    #loader a {
      color: #f0b860;
    }
    #loader-progress {
      width: min(24em, 80vw);
      accent-color: #f0b860;
    }
    #loader-play {
      padding: 0.5em 2em;
      border: 2px solid #f0b860;
      background: none;
      color: #f0b860;
      font: inherit;
      font-size: 1.5em;
      cursor: pointer;
    }
    #loader-play:hover,
    #loader-play:focus-visible {
      background: #f0b860;
      color: #2a2624;
    }
    </style>
    <noscript>
      <style>
      #loader-status,
      #loader-progress {
        display: none;
      }
      #loader-releases {
        display: block;
      }
      </style>
    </noscript>
  </head>
  <body>
    <div id="loader">
      <p id="loader-status">Loading</p>
      <noscript><p>This game needs JavaScript and WebGPU.</p></noscript>
      <progress id="loader-progress"></progress>
      <button id="loader-play" type="button" hidden>Play</button>
      <p id="loader-releases" hidden>
        You can download the game for Windows, macOS and Linux from the
        <a href="https://github.com/dsg-jam/ld60-game/releases">releases page</a>.
      </p>
    </div>
  </body>
</html>
