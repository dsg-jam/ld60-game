[package]
name = "ld60-game-city"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }
publish = { workspace = true }

[features]
debug_port = ["bevy/bevy_remote", "dep:serde_json", "ld60-game-core/debug_port"]

[dependencies]
ld60-game-core = { workspace = true }
ld60-geometry = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true, features = ["std"], optional = true }

[dependencies.bevy]
workspace = true
features = [
  "3d_bevy_render",
  "area_light_luts",
  "bevy_audio",
  "bevy_clipboard",
  "bevy_ui_widgets",
  "bevy_winit",
  "custom_cursor",
  "default_app",
  "multi_threaded",
  "picking",
  "std",
  "symphonia-vorbis",
  "sysinfo_plugin",
  "system_clipboard",
  "ui_api",
  "ui_bevy_render",
  "wav",
]

[dev-dependencies]
ld60-game-core = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
