name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build everything but skip the release and the Pages deploy
        type: boolean
        default: true

permissions:
  contents: read

env:
  TRUNK_VERSION: v0.21.14
  TRUNK_SHA256: f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b

jobs:
  desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: windows-2025
            name: windows-x86_64
          - os: macos-26
            name: macos-aarch64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release -p ld60-game
      - name: Package
        run: |
          dir=bugs-from-home-${{ matrix.name }}
          mkdir "$dir"
          cp -r assets "$dir/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/ld60-game.exe "$dir/"
            7z a "$dir.zip" "$dir"
          else
            cp target/release/ld60-game "$dir/"
            tar czf "$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: bugs-from-home-*.*

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install trunk
        run: |
          archive=trunk-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/trunk-rs/trunk/releases/download/$TRUNK_VERSION/$archive"
          echo "$TRUNK_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: trunk build --release --public-url ./
        working-directory: packages/game
      - run: cd dist && zip -r ../bugs-from-home-web.zip .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: bugs-from-home-web.zip
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  pages:
    needs: release
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    needs: [desktop, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - if: ${{ !inputs.dry-run && github.ref_type != 'tag' }}
        run: |
          echo "::error::Run the workflow from a tag to publish a release."
          exit 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - if: ${{ inputs.dry-run }}
        run: ls -l bugs-from-home-*
      - if: ${{ !inputs.dry-run }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes bugs-from-home-*
        env:
          GH_TOKEN: ${{ github.token }}
