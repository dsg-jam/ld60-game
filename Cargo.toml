[workspace]
resolver = "3"
members = [
  "packages/asm",
  "packages/calco",
  "packages/city",
  "packages/cli",
  "packages/core",
  "packages/devices",
  "packages/dsl",
  "packages/game",
  "packages/geometry",
  "packages/levels",
  "packages/locale",
  "packages/machine",
  "packages/store",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99.1"
authors = ["Kevin Schärer <dev@mineiwik.dev>", "Simon Berger <simon@siku2.io>"]
license = "MIT"
repository = "https://github.com/dsg-jam/ld60-game"
readme = "README.md"
publish = false

[workspace.dependencies]
ld60-asm = { path = "packages/asm" }
ld60-calco = { path = "packages/calco" }
ld60-city = { path = "packages/city" }
ld60-core = { path = "packages/core" }
ld60-devices = { path = "packages/devices" }
ld60-dsl = { path = "packages/dsl" }
ld60-geometry = { path = "packages/geometry" }
ld60-levels = { path = "packages/levels" }
ld60-locale = { path = "packages/locale" }
ld60-machine = { path = "packages/machine" }
ld60-store = { path = "packages/store" }

bevy = { version = "0.20.0", default-features = false }
fluent-bundle = { version = "0.16.0", default-features = false }
rand = { version = "0.10.3", default-features = false }
ron = { version = "0.12.2", default-features = false }
serde = { version = "1.0.229", default-features = false }
serde_json = { version = "1.0.154", default-features = false }
unic-langid = { version = "0.9.6", default-features = false }
web-sys = { version = "0.3.106", default-features = false }
winit = { version = "0.30.13", default-features = false }

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
arbitrary_source_item_ordering = "warn"
mod_module_files = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
