[package]
name = "ld60-game"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }
publish = { workspace = true }

[features]
debug_port = ["bevy/bevy_remote", "dep:serde_json"]

[dependencies]
fluent-bundle = { workspace = true }
ld60-calco = { workspace = true, features = ["serde"] }
ld60-devices = { workspace = true, features = ["serde"] }
ld60-levels = { workspace = true }
ld60-machine = { workspace = true }
rand = { workspace = true }
ron = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"], optional = true }
unic-langid = { workspace = true, features = ["macros"] }

[dependencies.bevy]
workspace = true
features = [
  "3d_bevy_render",
  "area_light_luts",
  "bevy_audio",
  "bevy_clipboard",
  "bevy_ui_widgets",
  "bevy_winit",
  "custom_cursor",
  "default_app",
  "multi_threaded",
  "picking",
  "scene",
  "std",
  "symphonia-vorbis",
  "sysinfo_plugin",
  "system_clipboard",
  "ui_api",
  "ui_bevy_render",
  "wav",
  "wayland",
  "webgl2",
  "webgpu",
  "x11",
]

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
workspace = true
features = ["Document", "Element", "Storage", "Window"]

[lints]
workspace = true
