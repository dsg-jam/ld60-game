[package]
name = "ld60-game-core"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }
publish = { workspace = true }

[features]
debug_port = ["bevy/bevy_remote", "dep:serde_json"]
test-support = []

[dependencies]
ld60-devices = { workspace = true }
ld60-geometry = { workspace = true }
ld60-locale = { workspace = true }
ld60-store = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"], optional = true }
winit = { workspace = true }

[dependencies.bevy]
workspace = true
features = [
  "3d_bevy_render",
  "area_light_luts",
  "bevy_audio",
  "bevy_clipboard",
  "bevy_ui_widgets",
  "bevy_winit",
  "custom_cursor",
  "default_app",
  "multi_threaded",
  "picking",
  "std",
  "symphonia-vorbis",
  "sysinfo_plugin",
  "system_clipboard",
  "ui_api",
  "ui_bevy_render",
  "wav",
]

[dev-dependencies]
ld60-locale = { workspace = true, features = ["test-support"] }
ld60-store = { workspace = true, features = ["test-support"] }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
workspace = true
features = ["Document", "Element", "Window"]

[lints]
workspace = true
